<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Бот Be Soft · платформа</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23027FFF'/%3E%3Cpath d='M18 33l28-12-9 26-6-9-13-5z' fill='%23C8FF3A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAFA; --card:#FFFFFF; --line:#E2E8F0; --line2:#F1F5F9;
  --text:#0F172A; --text2:#334155; --text3:#475569; --muted:#94A3B8;
  --violet:#644BEF; --violet-d:#523AD9; --violet-soft:#EFECFF; --lime:#D4FA33; --dark:#181424;
  --good:#10B981; --good-soft:#E7F8F1; --bad:#EF4444; --bad-soft:#FDECEC; --warn:#F59E0B; --warn-soft:#FEF4E2;
  --s1:#644BEF; --s2:#16A34A;
  --r:16px; --r2:12px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--violet);text-decoration:none}
.mono,.num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:20px 18px 16px}
.brand-mark{width:38px;height:38px;border-radius:11px;background:var(--violet);display:grid;place-items:center;color:var(--lime)}
.brand b{display:block;font-size:14px;font-weight:800;letter-spacing:-.01em}
.brand span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px;padding:6px 10px;flex:1}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--text3);font-weight:600;transition:.12s}
.nav a:hover{background:var(--line2);color:var(--text)}
.nav a.on{background:var(--violet-soft);color:var(--violet)}
.nav .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.side-foot{padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.botpill{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text3);padding:8px 10px;border-radius:10px;background:var(--line2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 0 3px var(--good-soft)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.user{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.user small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.main{min-width:0;padding:28px 32px 60px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.page-h h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-h p{color:var(--text3);margin-top:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ---------- ui ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line2)}
.card-h h3{font-size:15px;font-weight:700}
.card-b{padding:18px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid var(--line);background:#fff;color:var(--text);transition:.12s;white-space:nowrap}
.btn:hover{border-color:#CBD5E1;background:#F8FAFC}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.primary:hover{background:var(--violet-d)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft);border-color:#F8C4C4}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line2)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn .spin{width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;outline:0;transition:border-color .12s,box-shadow .12s}
.in:focus{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
textarea.in{resize:vertical;min-height:90px;line-height:1.5}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--text3);margin:0 0 6px}
.fld{margin-bottom:14px}
.help{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45}
.row{display:flex;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--line2);color:var(--text2);white-space:nowrap}
.chip.v{background:var(--violet-soft);color:var(--violet)}
.chip.g{background:var(--good-soft);color:#047857}
.chip.r{background:var(--bad-soft);color:#B91C1C}
.chip.y{background:var(--warn-soft);color:#B45309}
.chip.l{background:var(--lime);color:var(--dark)}.chip.b{background:#E0F2FE;color:#0369A1}
.chip button{color:inherit;opacity:.6;font-size:13px;line-height:1;margin-left:2px}
.chip button:hover{opacity:1}
.tbl-wrap{overflow:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff;position:sticky;top:0}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:#FBFBFE}
.tbl tr.click{cursor:pointer}
.tbl .r{text-align:right}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text2);font-size:15px;margin-bottom:6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line2);align-items:center}
.filters .in{width:auto;min-width:150px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--line2);color:var(--text3);font-size:13px}
.switch{position:relative;width:38px;height:22px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#CBD5E1;border-radius:22px;transition:.15s;cursor:pointer}
.switch span::before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--violet)}
.switch input:checked+span::before{transform:translateX(16px)}
.seg{display:inline-flex;background:var(--line2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--text3)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---------- toasts / modal ---------- */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200}
.toast{background:var(--text);color:#fff;padding:12px 16px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:380px;animation:tin .2s ease}
.toast.err{background:#B91C1C}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.mback{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:150;display:grid;place-items:center;padding:20px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:460px;box-shadow:0 30px 80px rgba(0,0,0,.25);overflow:hidden}
.modal.wide{max-width:640px}
.modal-h{padding:18px 22px 6px;font-size:17px;font-weight:800}
.modal-b{padding:10px 22px 18px;color:var(--text2);line-height:1.5}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:14px 22px;background:#F8FAFC;border-top:1px solid var(--line2)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)}
.auth-card{width:100%;max-width:400px;padding:30px}
.auth-card h2{font-size:22px;font-weight:800;margin:16px 0 6px}
.auth-card p{color:var(--text3);margin-bottom:20px;line-height:1.5}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{padding:18px 20px}
.kpi .k-l{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .k-v{font-size:28px;font-weight:700;margin-top:8px;letter-spacing:-.02em}
.kpi .k-s{font-size:12.5px;color:var(--text3);margin-top:4px}
.dash-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--text3);font-weight:600}
.cv{display:flex;align-items:center;gap:10px}.cv .cvbar{flex:1;height:8px;background:var(--line2);border-radius:6px;overflow:hidden;min-width:60px}.cv .cvbar i{display:block;height:100%;background:#16A34A;border-radius:6px}.cv b{min-width:42px;text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:700;border-top:2px solid var(--line);background:#FAFAFB}
.cv-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.cv-ctl{display:flex;gap:8px;flex-wrap:wrap}
.sub-l{color:var(--muted);font-size:12px;font-weight:500}
.gs-ico{width:22px;height:22px;border-radius:6px;background:#0F9D58;color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--text);color:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;line-height:1.55;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px;z-index:5}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.setup-banner{display:flex;gap:16px;align-items:center;padding:18px 20px;margin-bottom:18px;border:1px solid #DCD5FF;background:var(--violet-soft);border-radius:var(--r)}
.setup-banner b{display:block;font-size:15px}
.setup-banner p{color:var(--text3);margin-top:3px}

/* ---------- dialogs ---------- */
.dlg{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 130px);min-height:480px;overflow:hidden}
.dlg-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.dlg-list .filters{padding:12px}
.dlg-items{overflow:auto;flex:1}
.dlg-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line2);cursor:pointer}
.dlg-item:hover{background:#FBFBFE}
.dlg-item.on{background:var(--violet-soft)}
.ava{width:38px;height:38px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.dlg-item .meta{min-width:0;flex:1}
.dlg-item .nm{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:13.5px}
.dlg-item .nm small{font-weight:500;color:var(--muted);font-size:11.5px;flex:none}
.dlg-item .pv{color:var(--text3);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;display:flex;justify-content:space-between;gap:6px}
.dlg-item .pv .badge{background:var(--violet);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;flex:none}
.thread{display:flex;flex-direction:column;min-height:0}
.thread-h{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.thread-h .t-n{font-weight:700}
.thread-h .t-s{color:var(--muted);font-size:12.5px}
.msgs{flex:1;overflow:auto;padding:18px;background:#F4F6FA;display:flex;flex-direction:column;gap:6px}
.m{max-width:70%;padding:9px 12px;border-radius:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;font-size:13.5px;box-shadow:0 1px 1px rgba(0,0,0,.04)}
.m.in{background:#fff;align-self:flex-start;border-bottom-left-radius:4px}
.m.out{background:#E6E1FF;align-self:flex-end;border-bottom-right-radius:4px}
.m.out.adm{background:var(--violet);color:#fff}
.m small{display:block;font-size:10.5px;opacity:.6;margin-top:4px;text-align:right}
.m.btnclick{background:transparent;box-shadow:none;border:1px dashed #CBD5E1;color:var(--text3);font-size:12.5px}
.reply{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line);background:#fff}
.reply textarea{min-height:44px;max-height:160px}

/* ---------- drawer ---------- */
.drawer-back{position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:120}
.drawer{position:fixed;right:0;top:0;bottom:0;width:440px;max-width:100vw;background:#fff;z-index:121;box-shadow:-20px 0 60px rgba(0,0,0,.15);display:flex;flex-direction:column;animation:din .2s ease}
@keyframes din{from{transform:translateX(30px);opacity:0}}
.drawer-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.drawer-b{padding:18px 20px;overflow:auto;flex:1}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:13.5px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{word-break:break-word}
.tag-input{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;min-height:40px;background:#fff}
.tag-input input{border:0;outline:0;flex:1;min-width:110px;padding:4px}

/* ---------- flows list ---------- */
.flow-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.flow-card{padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:.12s}
.flow-card:hover{border-color:#C9C0FF;transform:translateY(-1px)}
.flow-card h4{font-size:15px;font-weight:700;line-height:1.3}
.flow-card .fm{display:flex;gap:14px;color:var(--text3);font-size:12.5px}
.flow-card .ff{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line2);padding-top:12px}

/* ---------- flow editor ---------- */
.fe{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.fe-top{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.fe-top .in{width:auto}
.fe-top .nm{font-weight:700;font-size:15px;min-width:220px}
.fe-body{flex:1;display:grid;grid-template-columns:62px 1fr 400px;min-height:0}
.palette{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
.palette button{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:var(--text3);border:1px solid transparent;position:relative}
.palette button:hover{background:var(--line2);color:var(--text)}
.palette button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:54px;top:50%;transform:translateY(-50%);background:var(--text);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:5}
.canvas{position:relative;overflow:hidden;background-color:#F5F6FA;background-image:radial-gradient(#D5DAE5 1px,transparent 1px);background-size:22px 22px;cursor:grab;user-select:none}
.canvas.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edges path{fill:none;stroke:#A8B1C4;stroke-width:2}
.edges path.hl{stroke:var(--violet);stroke-width:2.5}
.edges path.tmp{stroke:var(--violet);stroke-dasharray:6 5}
.edges circle{fill:#A8B1C4}
.edges circle.hl{fill:var(--violet)}
.node{position:absolute;width:260px;background:#fff;border:1.5px solid var(--line);border-radius:14px;box-shadow:0 2px 6px rgba(15,23,42,.06);cursor:default}
.node.sel{border-color:var(--violet);box-shadow:0 0 0 4px var(--violet-soft),0 6px 18px rgba(15,23,42,.1)}
.node-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line2);cursor:move;border-radius:14px 14px 0 0}
.node-h .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.node-h .ic svg{width:14px;height:14px}
.node-h b{font-size:12.5px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-h .start{font-size:10px;font-weight:800;background:var(--lime);color:var(--dark);padding:2px 6px;border-radius:6px;letter-spacing:.04em}
.node-b{padding:10px 12px;font-size:12.5px;color:var(--text2);line-height:1.45}
.node-b .txt{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.node-b .txt.ph{color:var(--muted);font-style:italic}
.node-b .media{display:inline-flex;gap:5px;align-items:center;font-size:11.5px;font-weight:600;color:var(--text3);background:var(--line2);border-radius:6px;padding:2px 7px;margin-bottom:6px}
.nbtn{position:relative;margin-top:6px;border:1px solid #D9DEE8;border-radius:8px;padding:6px 26px 6px 10px;font-weight:600;font-size:12px;text-align:center;color:var(--violet);background:#FBFAFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nbtn.url{color:var(--text3);background:#fff}
.nline{margin-top:6px;font-size:12px;color:var(--text3);display:flex;gap:6px;align-items:center}
.node-f{position:relative;display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:7px 12px;border-top:1px solid var(--line2);font-size:11.5px;font-weight:600;color:var(--muted)}
.node-f.two{justify-content:space-between}
.node-f .lab{position:relative;padding-right:18px}
.port{position:absolute;right:-8px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#fff;border:2.5px solid #A8B1C4;cursor:crosshair;z-index:2}
.port:hover,.port.con{border-color:var(--violet)}
.port.con{background:var(--violet)}
.node-f .lab .port{right:-4px}
.nbtn .port{right:-8px}
.node .in-port{position:absolute;left:-7px;top:16px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid #A8B1C4}
.node-stat{display:flex;gap:10px;padding:6px 12px;border-top:1px dashed var(--line2);font-size:11px;color:var(--muted);font-weight:600}
.zoomer{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:var(--shadow);align-items:center}
.zoomer button{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-weight:700;color:var(--text3)}
.zoomer button:hover{background:var(--line2)}
.zoomer span{font-size:12px;font-weight:600;color:var(--text3);min-width:42px;text-align:center}

/* ---------- api ---------- */
async function api(action, body = {}) {
  let r;
  try {
    r = await fetch(`${API}/admin/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {}) },
      body: JSON.stringify(body),
    });
  } catch (e) { throw new Error('Нет связи с сервером'); }
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && !['login', 'setup', 'status'].includes(action)) { doLogout(true); throw new Error(j.error || 'Требуется вход'); }
  if (!r.ok) throw new Error(j.error || ('Ошибка ' + r.status));
  return j;
}
async function uploadFile(file) {
  const r = await fetch(`${API}/admin/media.upload?name=${encodeURIComponent(file.name)}&type=${encodeURIComponent(file.type)}`, {
    method: 'POST', headers: { Authorization: 'Bearer ' + TOKEN }, body: file,
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Не удалось загрузить');
  return j.url;
}

/* ---------- toasts & modals ---------- */
function toast(msg, err = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), err ? 6000 : 3000);
}
const fail = e => toast(e?.message || String(e), true);
function modal({ title, body = '', ok = 'OK', cancel = 'Отмена', danger = false, wide = false, onOpen }) {
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'mback';
    back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}"><div class="modal-h">${title}</div><div class="modal-b">${body}</div>
      <div class="modal-f">${cancel ? `<button class="btn" data-r="0">${cancel}</button>` : ''}<button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${ok}</button></div></div>`;
    $('#layer').appendChild(back);
    const done = v => { back.remove(); resolve(v); };
    back.addEventListener('click', e => {
      if (e.target === back) done(false);
      const b = e.target.closest('[data-r]');
      if (!b) return;
      if (b.dataset.r === '1') {
        const inputs = $$('[name]', back);
        done(inputs.length ? Object.fromEntries(inputs.map(i => [i.name, i.type === 'checkbox' ? i.checked : i.value])) : true);
      } else done(false);
    });
    onOpen?.(back);
    setTimeout(() => $('input,textarea,select', back)?.focus(), 30);
  });
}
const confirmBox = (title, body, ok = 'Да', danger = false) => modal({ title, body, ok, danger });
async function busy(btn, fn) {
  if (!btn) return fn();
  const html = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>' + html;
  try { return await fn(); } finally { btn.disabled = false; btn.innerHTML = html; }
}

/* ---------- auth ---------- */
async function boot() {
  if (TOKEN) {
    try { S.me = await api('me'); return startApp(); } catch (e) { /* fallthrough */ }
  }
  showAuth();
}
async function showAuth() {
  $('#app').hidden = true;
  const el = $('#auth');
  el.hidden = false;
  let needsSetup = false;
  try { needsSetup = (await api('status')).needs_setup; } catch (e) { fail(e); }
  el.innerHTML = `<div class="auth"><div class="card auth-card">
    <div class="brand-mark">${ic('send')}</div>
    <h2>${needsSetup ? 'Первый запуск' : 'Вход в админку'}</h2>
    <p>${needsSetup ? 'Создайте главного администратора. Остальных сотрудников добавите в Настройках.' : 'Бот @besoft_uz_bot · рассылки и сценарии'}</p>
    <form id="authForm">
      ${needsSetup ? `<div class="fld"><label class="lbl">Ваше имя</label><input class="in" name="name" placeholder="Батыр"></div>` : ''}
      <div class="fld"><label class="lbl">Логин</label><input class="in" name="login" autocomplete="username" placeholder="латиницей, например batyr" required></div>
      <div class="fld"><label class="lbl">Пароль</label><input class="in" name="password" type="password" autocomplete="${needsSetup ? 'new-password' : 'current-password'}" required></div>
      ${needsSetup ? `<div class="fld"><label class="lbl">Пароль ещё раз</label><input class="in" name="password2" type="password" autocomplete="new-password" required></div>` : ''}
      <button class="btn primary" style="width:100%;padding:12px" type="submit">${needsSetup ? 'Создать и войти' : 'Войти'}</button>
    </form></div></div>`;
  $('#authForm').addEventListener('submit', async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if (needsSetup && f.password !== f.password2) return toast('Пароли не совпадают', true);
    await busy(e.submitter, async () => {
      try {
        const r = await api(needsSetup ? 'setup' : 'login', f);
        TOKEN = r.token; store.set('bs_admin_token', TOKEN);
        S.me = await api('me');
        startApp();
      } catch (err) { fail(err); }
    });
  });
}
function doLogout(silent) {
  if (TOKEN && !silent) api('logout').catch(() => {});
  TOKEN = null; store.set('bs_admin_token', null);
  showAuth();
}
$('#logout').addEventListener('click', () => doLogout(false));

let guard = null;           // функция, спрашивающая подтверждение ухода со страницы
let skipRoute = false;
let lastHash = location.hash;
window.addEventListener('hashchange', async () => {
  if (skipRoute) { skipRoute = false; return; }
  if (guard && !(await guard())) { skipRoute = true; location.hash = lastHash; return; }
  route();
});
window.addEventListener('beforeunload', e => { if (guard && window.__dirty) { e.preventDefault(); e.returnValue = ''; } });

const PAGES = {};
function route() {
  if (!TOKEN || $('#app').hidden) return;
  lastHash = location.hash;
  pageCleanup.forEach(f => { try { f(); } catch (e) {} });
  pageCleanup = [];
  guard = null; window.__dirty = false;
  $('#layer').innerHTML = '';
  const [page, ...args] = (location.hash.slice(1) || 'dashboard').split('/');
  const p = PAGES[page] ? page : 'dashboard';
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.nav === p));
  const old = $('#main');
  const main = old.cloneNode(false);
  old.replaceWith(main);
  main.innerHTML = '<div class="empty">Загрузка…</div>';
  PAGES[p](main, ...args).catch(e => { main.innerHTML = `<div class="card empty"><b>Не удалось загрузить</b>${esc(e.message)}</div>`; });
}
const pageHead = (title, sub = '', actions = '') => `<div class="page-h"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div><div class="actions">${actions}</div></div>`;

function plural(n, a, b, c) { n = Math.abs(+n || 0) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c; }

// --- Теги в боте: сегменты по лендингам + служебные + остальные (ручные / из сценариев) ---
function tagRows(st) {
  const counts = st.tags || {};
  const seg = [];
  for (const [l, t] of Object.entries(LANDING_TAG)) {
    let r = seg.find(x => x.t === t);
    if (!r) seg.push(r = { t, ls: [] });
    r.ls.push(l);
  }
  const rows = seg.map(r => [r.t, 'заявка с лендинга ' + r.ls.map(l => `${esc((LANDINGS[l] || {}).name || l)} <span class="sub-l">/${esc(l)}</span>`).join(' и ')]);
  for (const [t, d] of Object.entries(TAG_INFO)) rows.push([t, esc(d)]);
  const known = new Set(rows.map(r => r[0]));
  for (const t of Object.keys(counts).sort()) if (!known.has(t) && !/^lead_/.test(t)) rows.push([t, '<span class="sub-l">поставлен вручную или сценарием</span>']);
  return rows.map(([t, d]) => `<tr><td><span class="chip ${TAG_C[t] || 'v'}">${esc(t)}</span></td><td>${d}</td><td class="r num">${num(counts[t] || 0)}</td></tr>`).join('');
}

// --- Конверсия лидов в бот по тегу / лендингу / UTM-меткам за выбранный период ---
const CV_BY = [['tag', 'Тег в боте'], ['landing', 'Лендинг'], ['src', 'utm_source'], ['camp', 'utm_campaign'], ['med', 'utm_medium'], ['cnt', 'utm_content']];
const CV_P = [[1, 'Сегодня'], [7, '7 дней'], [30, '30 дней'], [0, 'Всё время']];
function renderConv() {
  const st = S.stats || {}, { by, p } = S.cv;
  const col = { 1: 5, 7: 7, 30: 9, 0: 11 }[p];
  const m = new Map();
  for (const r of st.breakdown || []) {
    const L = +r[col] || 0, J = +r[col + 1] || 0;
    if (!L) continue;
    const key = by === 'tag' ? (LANDING_TAG[r[0]] || 'lead_' + r[0]) : by === 'landing' ? r[0] : ({ src: r[1], med: r[2], camp: r[3], cnt: r[4] }[by] || '');
    const o = m.get(key) || { key, l: 0, j: 0 };
    o.l += L; o.j += J; m.set(key, o);
  }
  const rows = [...m.values()].sort((a, b) => b.l - a.l || b.j - a.j);
  const label = k => {
    if (by === 'tag') {
      const ls = Object.keys(LANDING_TAG).filter(l => LANDING_TAG[l] === k).map(l => (LANDINGS[l] || {}).name || l);
      return `<span class="chip ${TAG_C[k] || 'v'}">${esc(k)}</span> <span class="sub-l">${esc(ls.join(', '))}</span>`;
    }
    if (by === 'landing') return `${esc((LANDINGS[k] || {}).name || k)} <span class="chip ${TAG_C[LANDING_TAG[k]] || 'v'}">${esc(LANDING_TAG[k] || 'lead_' + k)}</span>`;
    return k ? esc(k) : '<span class="sub-l">— без метки —</span>';
  };
  const line = (name, l, j, cls = '') => {
    const v = l ? Math.round(j / l * 100) : 0;
    return `<tr class="${cls}"><td>${name}</td><td class="r num">${num(l)}</td><td class="r num">${num(j)}</td><td class="r num">${num(l - j)}</td><td><div class="cv"><div class="cvbar"><i style="width:${v}%"></i></div><b>${l ? v + '%' : '—'}</b></div></td></tr>`;
  };
  $('#cvH').textContent = (CV_BY.find(x => x[0] === by) || [])[1] || '';
  const tl = rows.reduce((a, r) => a + r.l, 0), tj = rows.reduce((a, r) => a + r.j, 0);
  $('#cvB').innerHTML = rows.length
    ? rows.map(r => line(label(r.key), r.l, r.j)).join('') + line('Всего', tl, tj, 'tot')
    : `<tr><td colspan="5"><div class="empty">За этот период лидов нет</div></td></tr>`;
}

function drawBars(el, data) {
  const W = 720, H = 260, pl = 34, pr = 8, pt = 12, pb = 30;
  const max = Math.max(4, ...data.map(d => d.leads));
  const step = Math.ceil(max / 4);
  const top = step * 4;
  const cw = (W - pl - pr) / data.length;
  const bw = Math.min(16, (cw - 10) / 2);
  const y = v => pt + (H - pt - pb) * (1 - v / top);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Лиды и переходы в бот за 14 дней">`;
  for (let i = 0; i <= 4; i++) {
    const v = step * i, yy = y(v);
    svg += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" stroke="#F1F5F9"/><text x="${pl - 8}" y="${yy + 4}" font-size="11" fill="#94A3B8" text-anchor="end" font-family="JetBrains Mono">${v}</text>`;
  }
  const bar = (x, v, color) => {
    if (!v) return '';
    const yy = y(v), h = H - pb - yy, r = Math.min(4, h);
    return `<path d="M${x} ${H - pb} V${yy + r} Q${x} ${yy} ${x + r} ${yy} H${x + bw - r} Q${x + bw} ${yy} ${x + bw} ${yy + r} V${H - pb} Z" fill="${color}"/>`;
  };
  data.forEach((d, i) => {
    const cx = pl + cw * i + cw / 2;
    svg += bar(cx - bw - 1, d.leads, '#027FFF') + bar(cx + 1, d.joined, '#0A0B0D');
    const [, m, dd] = d.d.split('-');
    if (i % 2 === 0 || data.length <= 8) svg += `<text x="${cx}" y="${H - 10}" font-size="11" fill="#94A3B8" text-anchor="middle">${dd}.${m}</text>`;
    svg += `<rect x="${pl + cw * i}" y="${pt}" width="${cw}" height="${H - pt - pb}" fill="transparent" data-i="${i}"/>`;
  });
  svg += `<line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="#E2E8F0"/></svg>`;
  el.innerHTML = svg + '<div class="tip" hidden></div>';
  const tip = $('.tip', el);
  el.addEventListener('mousemove', e => {
    const r = e.target.closest('rect[data-i]');
    if (!r) { tip.hidden = true; return; }
    const d = data[+r.dataset.i];
    const box = el.getBoundingClientRect(), rb = r.getBoundingClientRect();
    tip.hidden = false;
    tip.style.left = (rb.left + rb.width / 2 - box.left) + 'px';
    tip.style.top = (rb.top - box.top + 10) + 'px';
    const [yy, m, dd] = d.d.split('-');
    tip.innerHTML = `<b>${dd}.${m}.${yy}</b><br><i style="background:var(--s1)"></i>Лиды: <b>${d.leads}</b><br><i style="background:var(--s2)"></i>В боте: <b>${d.joined}</b><br><span style="opacity:.7">Новых подписчиков: ${d.subs}</span>`;
  });
  el.addEventListener('mouseleave', () => { tip.hidden = true; });
}

function downloadCSV(name, head, rows) {
  const cell = v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = String.fromCharCode(65279) + [head, ...rows].map(r => r.map(cell).join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function newNode(type, x, y) {
  const n = { id: uid('n'), type, x: Math.round(x), y: Math.round(y), next: null };
  if (type === 'message') Object.assign(n, { text: '', media: { type: 'none', url: '' }, buttons: [] });
  if (type === 'question') Object.assign(n, { text: '', var: 'answer', validate: 'any', options: [] });
  if (type === 'delay') Object.assign(n, { amount: 1, unit: 'hours' });
  if (type === 'action') Object.assign(n, { actions: [{ type: 'add_tag', value: '' }] });
  if (type === 'condition') Object.assign(n, { check: { type: 'has_tag', value: '' }, yes: null, no: null });
  return n;
}
const plain = t => String(t || '').replace(/<[^>]+>/g, '');
function tgHtml(text, sample = SAMPLE) {
  let s = esc(String(text || '').replace(/\{([a-zA-Z0-9_]+)\}/g, (m, k) => k in sample ? sample[k] : m));
  s = s.replace(/&lt;(\/?)(b|i|u|s|code)&gt;/g, '<$1$2>')
    .replace(/&lt;a href=(?:&quot;|&#39;)(https?:[^"'&<>]+)(?:&quot;|&#39;)&gt;/g, '<a href="$1" target="_blank">').replace(/&lt;\/a&gt;/g, '</a>');
  return s;
}
function tgPreview(m, flowCtx) {

function bindMsgEditor(root, getObj, onChange, onStructure) {
  root.addEventListener('input', e => {
    const k = e.target.dataset.k; if (!k) return;
    let v = e.target.type === 'checkbox' ? e.target.checked : e.target.value;
    if (k.endsWith('.flow_id') || k === 'amount') v = Number(v) || null;
    if (k.endsWith('.target') || k === 'next' || k === 'yes' || k === 'no') v = v || null;
    setPath(getObj(), k, v);
    if (k === 'media.type') { const u = $('[data-k="media.url"]', root); if (u) u.disabled = v === 'none'; }
    if (e.target.type === 'checkbox' && k === 'request_contact' || e.target.hasAttribute('data-rerender')) return onStructure();
    onChange(k);
  });
  root.addEventListener('click', async e => {
    const t = e.target;
    const tb = t.closest('[data-wrap],[data-ins]');
    if (tb) {
      const ta = $('textarea[data-k="text"]', tb.closest('.fld'));
      const [a, b] = [ta.selectionStart, ta.selectionEnd];
      const sel = ta.value.slice(a, b);
      let ins;
      if (tb.dataset.ins) ins = tb.dataset.ins;
      else if (tb.dataset.wrap === 'a') { const url = prompt('Ссылка (https://…)', 'https://'); if (!url) return; ins = `<a href="${url}">${sel || 'ссылка'}</a>`; }
      else ins = `<${tb.dataset.wrap}>${sel}</${tb.dataset.wrap}>`;
      ta.setRangeText(ins, a, b, 'end'); ta.focus();
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    if (t.closest('[data-addbtn]')) { const o = getObj(); o.buttons = o.buttons || []; o.buttons.push({ id: uid('b'), label: '', type: 'url', url: '' }); return onStructure(); }
    const rm = t.closest('[data-rmbtn]');
    if (rm) { getObj().buttons.splice(+rm.dataset.rmbtn, 1); return onStructure(); }
  });
  root.addEventListener('change', async e => {
    if (!e.target.matches('[data-upload]')) return;
    const file = e.target.files[0]; if (!file) return;
    const lab = e.target.closest('label');
    try {
      lab.classList.add('disabled'); toast('Загрузка…');
      const url = await uploadFile(file);
      const o = getObj();
      o.media = { type: file.type.startsWith('image/') ? 'photo' : file.type.startsWith('video/') ? 'video' : 'document', url };
      toast('Файл загружен'); onStructure();
    } catch (err) { fail(err); } finally { lab.classList.remove('disabled'); }
  });
}

async function flowEditor(main, id) {
  await loadFlows();
  let flow, stats = {};
  if (id) { const r = await api('flows.get', { id }); flow = r.flow; stats = r.stats || {}; }
  else {

        <button class="btn primary" id="saveBtn">${ic('save')} Сохранить<span id="dirtyMark" hidden>•</span></button>

    </div>
    <div class="fe-body">
      <div class="palette">${Object.entries(NT).map(([k, v]) => `<button data-add="${k}" data-tip="${v.t}"><span class="ic" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:${v.c};color:#fff">${ic(k)}</span></button>`).join('')}</div>
      <div class="canvas" id="cv"><div class="world" id="world"></div>
        <div class="canvas-hint">Тяните от кружка ● к блоку, чтобы соединить · отпустите на пустом месте — новый блок · двойной клик по ● — разорвать</div>
        <div class="zoomer"><button id="zOut">−</button><span id="zVal">100%</span><button id="zIn">+</button><button id="zFit" title="Показать всё">${ic('fit')}</button></div>
      </div>
      <div class="panel" id="panel"></div>
    </div></div>`;

  const cv = $('#cv'), world = $('#world'), panel = $('#panel');
  const byId = nid => flow.nodes.find(n => n.id === nid);
  const applyView = () => { world.style.transform = `translate(${V.x}px,${V.y}px) scale(${V.z})`; $('#zVal').textContent = Math.round(V.z * 100) + '%'; };

  function trigUI() {

    inp.hidden = !t.ph; inp.placeholder = t.ph;
    let h = t.help;
    if ($('#fTrig').value === 'ref' && S.bot && inp.value) h += ` Ссылка: t.me/${S.bot}?start=${splitFirst(inp.value)}`;
    $('#trigHelp').textContent = h;
  }
  const splitFirst = v => String(v).split(',')[0].trim();
  trigUI();
  $('#fName').addEventListener('input', e => { flow.name = e.target.value; setDirty(true); });
  $('#fTrig').addEventListener('change', e => { flow.trigger_type = e.target.value; trigUI(); setDirty(true); });
  $('#fTrigVal').addEventListener('input', e => { flow.trigger_value = e.target.value; trigUI(); setDirty(true); });
  $('#fActive').addEventListener('change', e => { flow.is_active = e.target.checked; setDirty(true); });

  /* ---- рендер блоков ---- */
  function portHTML(nid, kind, target) { return `<span class="port ${target ? 'con' : ''}" data-port="${nid}|${kind}"></span>`; }
  function nodeBody(n) {
    const st = stats[n.id];

      if (n.media && n.media.type !== 'none' && n.media.url) b += `<div class="media">${{ photo: '🖼 Фото', video: '🎬 Видео', document: '📎 Файл' }[n.media.type]}</div>`;
      b += `<div class="txt ${n.text ? '' : 'ph'}">${n.text ? esc(plain(n.text)) : 'Пустое сообщение'}</div>`;
      if (n.request_contact) b += `<div class="nline">📱 Запрос номера: «${esc(n.contact_label || 'Рақамни юбориш')}»</div>`;

        if (!bt.label && bt.type !== 'goto') return;
        if (bt.type === 'goto') b += `<div class="nbtn">${esc(bt.label || 'Кнопка')}${portHTML(n.id, 'btn:' + bt.id, bt.target)}</div>`;
        else if (bt.type === 'url') b += `<div class="nbtn url">${esc(bt.label)} ↗</div>`;

      });

      b += `<div class="txt ${n.text ? '' : 'ph'}">${n.text ? esc(plain(n.text)) : 'Текст вопроса'}</div>`;
      if ((n.options || []).filter(Boolean).length) b += `<div class="row" style="flex-wrap:wrap;gap:4px;margin-top:6px">${n.options.filter(Boolean).map(o => `<span class="chip">${esc(o)}</span>`).join('')}</div>`;
      b += `<div class="nline">💾 ответ → <b>{${esc(n.var || 'answer')}}</b>${n.validate !== 'any' ? ` · ${n.validate === 'phone' ? 'телефон' : 'число'}` : ''}</div>`;
      foot = `<div class="node-f"><span class="lab">После ответа${portHTML(n.id, 'next', n.next)}</span></div>`;
    } else if (n.type === 'delay') {
      b += `<div style="font-size:15px;font-weight:700;color:var(--text)">⏱ ${n.amount || 1} ${UNITS[n.unit] || 'мин'}</div>${(UNITS[n.unit] === 'сек' && n.amount <= 10) ? '<div class="nline">с анимацией «печатает…»</div>' : ''}`;
      foot = `<div class="node-f"><span class="lab">Затем${portHTML(n.id, 'next', n.next)}</span></div>`;
    } else if (n.type === 'action') {
      b += (n.actions || []).map(a => {
        if (a.type === 'add_tag') return `<div class="nline">🏷 + <b>${esc(a.value || '…')}</b></div>`;
        if (a.type === 'remove_tag') return `<div class="nline">🏷 − <b>${esc(a.value || '…')}</b></div>`;
        if (a.type === 'set_field') return `<div class="nline">📋 {${esc(a.key || '…')}} = ${esc(a.value || '')}</div>`;
        if (a.type === 'notify') return `<div class="nline">🔔 Уведомить менеджеров</div>`;
        if (a.type === 'lead_status') return `<div class="nline">📊 Статус лида: ${esc(LEAD_ST[a.value]?.[0] || a.value || '…')}</div>`;

        return '';
      }).join('') || '<div class="txt ph">Нет действий</div>';
      foot = `<div class="node-f"><span class="lab">Далее${portHTML(n.id, 'next', n.next)}</span></div>`;
    } else if (n.type === 'condition') {
      const c = n.check || {};
      b += `<div style="font-weight:600;color:var(--text)">Если: ${esc(COND[c.type] || '')} ${['has_tag', 'no_tag'].includes(c.type) ? `<span class="chip v">${esc(c.value || '…')}</span>` : ''}${c.type === 'field_eq' ? `{${esc(c.key || '…')}} = «${esc(c.value || '')}»` : ''}${c.type === 'field_set' ? `{${esc(c.key || '…')}}` : ''}</div>`;
      foot = `<div class="node-f two"><span class="lab" style="color:#047857">✓ Да${portHTML(n.id, 'yes', n.yes)}</span><span class="lab" style="color:#B91C1C">✗ Нет${portHTML(n.id, 'no', n.no)}</span></div>`;

    const sline = st && (st.sent || st.clicks) ? `<div class="node-stat">${n.type === 'message' || n.type === 'question' ? `📤 ${num(st.sent)}` : `▶ ${num(st.sent)}`}${st.clicks ? ` · 👆 ${num(st.clicks)} (${pct(st.clicks, st.sent)})` : ''}</div>` : '';
    return `<div class="node-b">${b}</div>${sline}${foot}`;
  }
  function nodeHTML(n) {

      ${nodeBody(n)}</div>`;
  }
  function renderNodes() {
    world.innerHTML = '<svg class="edges" id="edges"></svg>' + flow.nodes.map(nodeHTML).join('');
    drawEdges();
  }
  function refreshNode(n) {
    const el = $(`[data-node="${n.id}"]`, world);
    if (!el) return renderNodes();
    el.outerHTML = nodeHTML(n);
    drawEdges();
  }
  function conns() {
    const out = [];
    flow.nodes.forEach(n => {
      if (n.next) out.push([n.id, 'next', n.next]);
      if (n.type === 'condition') { if (n.yes) out.push([n.id, 'yes', n.yes]); if (n.no) out.push([n.id, 'no', n.no]); }
      if (n.type === 'message' && !n.request_contact) (n.buttons || []).forEach(b => { if (b.type === 'goto' && b.target) out.push([n.id, 'btn:' + b.id, b.target]); });
    });
    return out;
  }
  function pt(el, anchor) {
    const wr = world.getBoundingClientRect(), r = el.getBoundingClientRect();
    return anchor === 'in'
      ? { x: (r.left - wr.left) / V.z, y: (r.top - wr.top) / V.z + 22 }
      : { x: (r.left + r.width / 2 - wr.left) / V.z, y: (r.top + r.height / 2 - wr.top) / V.z };
  }
  const curve = (a, b) => { const dx = Math.max(50, Math.abs(b.x - a.x) / 2); return `M${a.x} ${a.y} C${a.x + dx} ${a.y},${b.x - dx} ${b.y},${b.x} ${b.y}`; };
  function drawEdges(tmp) {

      h += `<path class="${hl}" d="${curve(a, b)}"/><circle class="${hl}" cx="${b.x}" cy="${b.y}" r="4"/>`;
    });
    if (tmp) h += `<path class="tmp" d="${curve(tmp.a, tmp.b)}"/>`;
    svg.innerHTML = h;
  }
  function setConn(from, kind, to) {
    const n = byId(from); if (!n) return;
    if (to === from) return;

    else if (kind === 'yes') n.yes = to;

  const nodeOptions = (cur, exclude) => `<option value="">— не продолжать —</option>` + flow.nodes.filter(x => x.id !== exclude).map(x => `<option value="${x.id}" ${cur === x.id ? 'selected' : ''}>${NT[x.type].t}: ${esc(plain(x.text || (x.type === 'delay' ? `${x.amount} ${UNITS[x.unit]}` : x.type === 'action' ? (x.actions || []).map(a => ACT[a.type]).join(', ') : x.type === 'condition' ? COND[x.check?.type] : '')).slice(0, 40) || x.id)}</option>`).join('');

    } else if (n.type === 'question') {

    } else if (n.type === 'delay') {

        <div class="help" style="margin-bottom:14px">До 10 секунд — пауза с анимацией «печатает…». Дольше — бот продолжит позже автоматически (проверка раз в минуту).</div>
        <div class="fld"><label class="lbl">Затем</label><select class="in" data-k="next">${nodeOptions(n.next, n.id)}</select></div>`;
    } else if (n.type === 'action') {
      body = (n.actions || []).map((a, i) => `<div class="sub-card"><div class="row"><select class="in" data-k="actions.${i}.type" data-rerender>${Object.entries(ACT).map(([k, v]) => `<option value="${k}" ${a.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select><button class="btn ghost sm danger" data-rmact="${i}">${ic('trash')}</button></div>
        ${['add_tag', 'remove_tag'].includes(a.type) ? `<input class="in" data-k="actions.${i}.value" value="${esc(a.value || '')}" placeholder="тег (можно несколько через запятую)" list="tagsdl">` : ''}
        ${a.type === 'set_field' ? `<div class="grid2"><input class="in" data-k="actions.${i}.key" value="${esc(a.key || '')}" placeholder="поле"><input class="in" data-k="actions.${i}.value" value="${esc(a.value || '')}" placeholder="значение"></div>` : ''}
        ${a.type === 'notify' ? `<textarea class="in" data-k="actions.${i}.text" rows="3" placeholder="Текст уведомления. Можно {name}, {phone}, {question}">${esc(a.text || '')}</textarea><div class="help">Уйдёт в группы/людям из Настроек → Уведомления. Имя, телефон и ссылка на диалог добавятся автоматически.</div>` : ''}
        ${a.type === 'lead_status' ? `<select class="in" data-k="actions.${i}.value">${Object.entries(LEAD_ST).map(([k, v]) => `<option value="${k}" ${a.value === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select>` : ''}
        ${a.type === 'start_flow' ? `<select class="in" data-k="actions.${i}.flow_id"><option value="">—</option>${S.flows.filter(f => f.id !== flow.id).map(f => `<option value="${f.id}" ${+a.flow_id === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>` : ''}
        </div>`).join('') +
        `<button class="btn sm" data-addact>${ic('plus')} Действие</button><datalist id="tagsdl">${S.tags.map(t => `<option value="${esc(t.tag)}">`).join('')}</datalist>

        <datalist id="tagsdl">${S.tags.map(t => `<option value="${esc(t.tag)}">`).join('')}</datalist>
        <div class="fld"><label class="lbl" style="color:#047857">✓ Если да</label><select class="in" data-k="yes">${nodeOptions(n.yes, n.id)}</select></div>
        <div class="fld"><label class="lbl" style="color:#B91C1C">✗ Если нет</label><select class="in" data-k="no">${nodeOptions(n.no, n.id)}</select></div>`;
    }
    panel.innerHTML = `<div class="panel-h"><span class="ic" style="width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:${t.c};color:#fff">${ic(n.type)}</span><b>${t.t}</b>
      ${flow.start_node !== n.id ? `<button class="btn sm" data-mkstart title="Сделать стартовым">▶ Старт</button>` : '<span class="chip l">СТАРТ</span>'}
      <button class="btn ghost sm" data-dupnode title="Дублировать">${ic('copy')}</button><button class="btn ghost sm danger" data-delnode title="Удалить">${ic('trash')}</button></div>
      <div class="panel-b" id="pb">${body}</div>`;
  }
  // один раз вешаем обработчики панели
  bindMsgEditor(panel, () => byId(sel), k => {
    const n = byId(sel); setDirty(true); refreshNode(n);
    const pv = $('#pv', panel);
    if (pv) pv.innerHTML = n.type === 'question' ? tgPreview({ text: n.text, options: n.options, request_contact: n.validate === 'phone' && !(n.options || []).filter(Boolean).length }) : tgPreview(n);
  }, () => { setDirty(true); refreshNode(byId(sel)); renderPanel(); });
  panel.addEventListener('click', e => {
    const n = byId(sel); if (!n) return;
    const t = e.target;
    if (t.closest('[data-mkstart]')) { flow.start_node = n.id; setDirty(true); renderNodes(); renderPanel(); }
    else if (t.closest('[data-delnode]')) delNode(n.id);
    else if (t.closest('[data-dupnode]')) { const c = clone(n); c.id = uid('n'); c.x += 40; c.y += 40; (c.buttons || []).forEach(b => b.id = uid('b')); flow.nodes.push(c); sel = c.id; setDirty(true); renderNodes(); renderPanel(); }
    else if (t.closest('[data-addopt]')) { (n.options = n.options || []).push(''); setDirty(true); renderPanel(); refreshNode(n); }
    else if (t.closest('[data-rmopt]')) { n.options.splice(+t.closest('[data-rmopt]').dataset.rmopt, 1); setDirty(true); renderPanel(); refreshNode(n); }
    else if (t.closest('[data-addact]')) { (n.actions = n.actions || []).push({ type: 'add_tag', value: '' }); setDirty(true); renderPanel(); refreshNode(n); }
    else if (t.closest('[data-rmact]')) { n.actions.splice(+t.closest('[data-rmact]').dataset.rmact, 1); setDirty(true); renderPanel(); refreshNode(n); }
  });

  function delNode(nid) {
    flow.nodes = flow.nodes.filter(x => x.id !== nid);
    flow.nodes.forEach(x => {
      ['next', 'yes', 'no'].forEach(k => { if (x[k] === nid) x[k] = null; });
      (x.buttons || []).forEach(b => { if (b.target === nid) b.target = null; });
    });
    if (flow.start_node === nid) flow.start_node = flow.nodes[0]?.id || null;
    if (sel === nid) sel = null;
    setDirty(true); renderNodes(); renderPanel();
  }
  function addNode(type, x, y, connectFrom) {
    const n = newNode(type, x, y);
    flow.nodes.push(n);
    if (!flow.start_node) flow.start_node = n.id;
    sel = n.id;
    setDirty(true);
    renderNodes();
    if (connectFrom) setConn(connectFrom.from, connectFrom.kind, n.id);
    renderPanel();
    return n;
  }
  const centerPos = () => { const r = cv.getBoundingClientRect(); return { x: (r.width / 2 - V.x) / V.z - 130 + (Math.random() * 40 - 20), y: (r.height / 2 - V.y) / V.z - 80 + (Math.random() * 40 - 20) }; };
  $$('[data-add]', main).forEach(b => b.addEventListener('click', () => { const p = centerPos(); addNode(b.dataset.add, p.x, p.y); }));

  /* ---- мышь: перетаскивание, соединения, панорама ---- */
  let drag = null;
  const toWorld = (cx, cy) => { const r = cv.getBoundingClientRect(); return { x: (cx - r.left - V.x) / V.z, y: (cy - r.top - V.y) / V.z }; };
  cv.addEventListener('mousedown', e => {
    closeMenu();
    if (e.button !== 0) return;
    const port = e.target.closest('[data-port]');
    if (port) {
      e.preventDefault(); e.stopPropagation();
      const [from, kind] = port.dataset.port.split('|');
      drag = { mode: 'link', from, kind, a: pt(port) };
      return;
    }
    const nodeEl = e.target.closest('[data-node]');
    if (nodeEl) {
      const nid = nodeEl.dataset.node;
      if (sel !== nid) { sel = nid; $$('.node.sel', world).forEach(x => x.classList.remove('sel')); nodeEl.classList.add('sel'); drawEdges(); renderPanel(); }
      if (e.target.closest('.node-h')) {
        const n = byId(nid);
        drag = { mode: 'node', n, el: nodeEl, sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y, moved: false };
      }
      return;
    }
    if (sel) { sel = null; $$('.node.sel', world).forEach(x => x.classList.remove('sel')); drawEdges(); renderPanel(); }
    drag = { mode: 'pan', sx: e.clientX, sy: e.clientY, ox: V.x, oy: V.y };
    cv.classList.add('panning');
  });
  const onMove = e => {
    if (!drag) return;
    if (drag.mode === 'pan') { V.x = drag.ox + e.clientX - drag.sx; V.y = drag.oy + e.clientY - drag.sy; applyView(); }
    else if (drag.mode === 'node') {
      const dx = (e.clientX - drag.sx) / V.z, dy = (e.clientY - drag.sy) / V.z;
      if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
      drag.n.x = Math.round(drag.ox + dx); drag.n.y = Math.round(drag.oy + dy);
      drag.el.style.left = drag.n.x + 'px'; drag.el.style.top = drag.n.y + 'px';
      drawEdges();
    } else if (drag.mode === 'link') drawEdges({ a: drag.a, b: toWorld(e.clientX, e.clientY) });
  };
  const onUp = e => {
    if (!drag) return;
    const d = drag; drag = null;
    cv.classList.remove('panning');
    if (d.mode === 'node' && d.moved) setDirty(true);
    if (d.mode === 'link') {
      const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-node]');
      if (target && target.dataset.node !== d.from) setConn(d.from, d.kind, target.dataset.node);
      else if (!target && e.target.closest?.('#cv')) openMenu(e.clientX, e.clientY, d);
      drawEdges();
    }
  };
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  pageCleanup.push(() => { window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onUp); });
  cv.addEventListener('dblclick', e => {
    const port = e.target.closest('[data-port]'); if (!port) return;
    const [from, kind] = port.dataset.port.split('|');
    setConn(from, kind, null);
  });
  cv.addEventListener('wheel', e => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
      const nz = Math.min(1.6, Math.max(0.3, V.z * (e.deltaY < 0 ? 1.1 : 0.9)));
      V.x = mx - (mx - V.x) * nz / V.z; V.y = my - (my - V.y) * nz / V.z; V.z = nz;
    } else { V.x -= e.deltaX; V.y -= e.deltaY; }
    applyView();
  }, { passive: false });
  const zoomBy = f => { const r = cv.getBoundingClientRect(), mx = r.width / 2, my = r.height / 2; const nz = Math.min(1.6, Math.max(0.3, V.z * f)); V.x = mx - (mx - V.x) * nz / V.z; V.y = my - (my - V.y) * nz / V.z; V.z = nz; applyView(); };
  $('#zIn').addEventListener('click', () => zoomBy(1.15));
  $('#zOut').addEventListener('click', () => zoomBy(1 / 1.15));
  function fit() {
    if (!flow.nodes.length) return;
    const r = cv.getBoundingClientRect();
    const xs = flow.nodes.map(n => n.x), ys = flow.nodes.map(n => n.y);
    const minX = Math.min(...xs), minY = Math.min(...ys), maxX = Math.max(...xs) + 270, maxY = Math.max(...ys) + 260;
    V.z = Math.min(1, Math.max(0.6, Math.min((r.width - 80) / (maxX - minX), (r.height - 80) / (maxY - minY))));
    const w = (maxX - minX) * V.z;
    V.x = (w < r.width - 80 ? (r.width - w) / 2 : 40) - minX * V.z; V.y = 50 - minY * V.z;
    applyView(); drawEdges();
  }
  $('#zFit').addEventListener('click', fit);

  let menuEl = null;
  function closeMenu() { menuEl?.remove(); menuEl = null; }
  function openMenu(cx, cy, d) {
    closeMenu();
    const r = cv.getBoundingClientRect();
    menuEl = document.createElement('div');
    menuEl.className = 'addmenu';
    menuEl.style.left = (cx - r.left) + 'px'; menuEl.style.top = (cy - r.top) + 'px';
    menuEl.innerHTML = '<div style="font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 10px">Новый блок</div>' + Object.entries(NT).map(([k, v]) => `<button data-mk="${k}"><span class="ic" style="background:${v.c}">${ic(k)}</span>${v.t}</button>`).join('');
    cv.appendChild(menuEl);
    const w = toWorld(cx, cy);
    menuEl.addEventListener('mousedown', e => e.stopPropagation());
    menuEl.addEventListener('click', e => { const b = e.target.closest('[data-mk]'); if (!b) return; closeMenu(); addNode(b.dataset.mk, w.x, w.y - 20, d); });
  }

  /* ---- клавиатура, сохранение, тест ---- */
  const onKey = e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
    if (e.key === 'Delete' && sel && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) { e.preventDefault(); delNode(sel); }
    if (e.key === 'Escape') closeMenu();
  };
  window.addEventListener('keydown', onKey);
  pageCleanup.push(() => window.removeEventListener('keydown', onKey));

  function validate() {
    const warn = [];
    if (!flow.nodes.length) warn.push('В сценарии нет блоков');
    flow.nodes.forEach(n => {
      if ((n.type === 'message' || n.type === 'question') && !String(n.text || '').trim() && !(n.media?.url)) warn.push(`${NT[n.type].t}: пустой текст`);
      (n.buttons || []).forEach(b => { if (b.type === 'goto' && !b.target && b.label) warn.push(`Кнопка «${b.label}» никуда не ведёт`); if (b.type === 'url' && b.label && !/^https?:\/\//.test(b.url || '')) warn.push(`Кнопка «${b.label}»: нужна ссылка https://`); });
    });
    if (flow.is_active && flow.trigger_type !== 'manual') {
      const same = S.flows.filter(f => f.id !== flow.id && f.is_active && f.trigger_type === flow.trigger_type && String(f.trigger_value || '') === String(flow.trigger_value || ''));
      if (same.length && ['start', 'default', 'lead'].includes(flow.trigger_type)) warn.push(`Такой же запуск уже у сценария «${same[0].name}» — сработает тот, что создан раньше`);
    }
    return warn;
  }
  async function save() {
    const w = validate();
    if (w.length && !(await confirmBox('Сохранить с предупреждениями?', '<ul style="padding-left:18px">' + w.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>', 'Сохранить'))) return false;
    return busy($('#saveBtn'), async () => {
      try {
        const r = await api('flows.save', { flow });
        setDirty(false);
        if (!flow.id) { flow.id = r.id; skipRoute = true; location.hash = '#flows/' + r.id; lastHash = location.hash; }
        await loadFlows();
        toast('Сценарий сохранён');
        return true;
      } catch (err) { fail(err); return false; }
    });
  }
  $('#saveBtn').addEventListener('click', save);
  $('#testBtn').addEventListener('click', async e => {
    if (dirty && !(await save())) return;
    busy(e.currentTarget, async () => { try { await api('flows.test', { id: flow.id }); toast('Отправлено в ваш Telegram'); } catch (err) { fail(err); } });
  });

  applyView(); renderNodes(); renderPanel(); setDirty(dirty);
  requestAnimationFrame(fit);
}

const BC_ST = { draft: ['Черновик', ''], scheduled: ['Запланирована', 'y'], sending: ['Отправляется', 'v'], done: ['Отправлена', 'g'], cancelled: ['Отменена', 'r'] };
function audText(a) {
  if (!a) return 'Все подписчики';
  const p = [];
  if (a.lead === 'yes') p.push('оставили заявку'); if (a.lead === 'no') p.push('без заявки');
  if (a.tags_any?.length) p.push('теги: ' + a.tags_any.join(', '));
  if (a.tags_none?.length) p.push('без: ' + a.tags_none.join(', '));
  if (a.joined_from || a.joined_to) p.push(`пришли ${a.joined_from || '…'} — ${a.joined_to || '…'}`);
  return p.length ? p.join(' · ') : 'Все подписчики';
}
PAGES.broadcasts = async (main, id) => {
  if (id) return broadcastEditor(main, id === 'new' ? null : +id);
  const items = (await api('broadcasts.list')).items || [];
  main.innerHTML = pageHead('Рассылки', 'Массовые сообщения подписчикам бота по сегментам.', `<a class="btn primary" href="#broadcasts/new">${ic('plus')} Новая рассылка</a>`) +
    `<div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Рассылка</th><th>Статус</th><th>Аудитория</th><th>Доставлено</th><th class="r">Ошибки / блок</th><th>Дата</th></tr></thead><tbody>
    ${items.length ? items.map(b => `<tr class="click" data-id="${b.id}">
      <td><b>${esc(b.title)}</b><div style="color:var(--muted);font-size:12px;max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(plain(b.message?.text))}</div></td>
      <td><span class="chip ${BC_ST[b.status]?.[1]}">${BC_ST[b.status]?.[0] || b.status}</span></td>
      <td style="color:var(--text3);font-size:12.5px;max-width:240px">${esc(audText(b.audience))}</td>
      <td>${b.total ? `<div class="row"><div class="prog"><i style="width:${Math.round((b.sent + b.failed + b.blocked) / b.total * 100)}%"></i></div><span class="num">${num(b.sent)}/${num(b.total)}</span></div>` : '—'}</td>
      <td class="r num">${num(b.failed)} / ${num(b.blocked)}</td>
      <td class="num" style="white-space:nowrap">${fmtDate(b.status === 'scheduled' ? b.scheduled_at : (b.started_at || b.created_at))}</td></tr>`).join('')
    : `<tr><td colspan="6"><div class="empty"><b>Рассылок пока нет</b>Создайте первую — например, анонс диагностики для всех лидов</div></td></tr>`}
    </tbody></table></div></div>`;
  main.addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if (tr) location.hash = '#broadcasts/' + tr.dataset.id; });
  if (items.some(b => b.status === 'sending')) { const t = setTimeout(route, 5000); pageCleanup.push(() => clearTimeout(t)); }
};

async function broadcastEditor(main, id) {
  await Promise.all([loadTags(), loadFlows()]);
  let bc = { title: 'Рассылка ' + new Date().toLocaleDateString('ru-RU'), message: { text: '', media: { type: 'none', url: '' }, buttons: [], preview: false }, audience: { lead: 'any', tags_any: [], tags_none: [], joined_from: '', joined_to: '' }, status: 'draft' };
  let errors = [];
  if (id) { const r = await api('broadcasts.get', { id }); bc = r.broadcast; errors = r.errors; }
  const editable = ['draft', 'scheduled'].includes(bc.status);
  if (!editable) return broadcastView(main, bc, errors);
  bc.audience = Object.assign({ lead: 'any', tags_any: [], tags_none: [], joined_from: '', joined_to: '' }, bc.audience || {});
  let dirty = false;
  const setDirty = v => { dirty = v; window.__dirty = v; };
  guard = async () => !dirty || await confirmBox('Выйти без сохранения?', 'Черновик не сохранён.', 'Выйти', true);

  main.innerHTML = pageHead(`<a href="#broadcasts" class="btn ghost sm" style="margin-right:6px">${ic('back')}</a>${id ? 'Рассылка' : 'Новая рассылка'}`, bc.status === 'scheduled' ? `Запланирована на ${fmtDate(bc.scheduled_at)} (Ташкент)` : '',
    `<button class="btn" id="bTest">${ic('play')} Тест себе</button><button class="btn" id="bSave">${ic('save')} Сохранить</button><button class="btn primary" id="bSend">${ic('send')} Отправить…</button>`) +
    `<div class="bc-layout"><div>
      <div class="card" style="margin-bottom:16px"><div class="card-b">
        <div class="fld"><label class="lbl">Название (видно только в админке)</label><input class="in" id="bTitle" value="${esc(bc.title)}"></div>
        <div id="msgEd"></div></div></div>
      <div class="card"><div class="card-h"><h3>Кому отправить</h3></div><div class="card-b" id="audEd"></div></div>
    </div>
    <div style="position:sticky;top:20px"><div class="card"><div class="card-h"><h3>Превью в Telegram</h3></div><div class="card-b" id="bPrev"></div></div></div></div>`;

  const msgEd = $('#msgEd');
  const renderMsg = () => { msgEd.innerHTML = msgEditorHTML(bc.message, { flow: false, contact: false }); $('#bPrev').innerHTML = tgPreview(bc.message); };
  bindMsgEditor(msgEd, () => bc.message, () => { setDirty(true); $('#bPrev').innerHTML = tgPreview(bc.message); }, () => { setDirty(true); renderMsg(); });
  renderMsg();
  $('#bTitle').addEventListener('input', e => { bc.title = e.target.value; setDirty(true); });

  const a = bc.audience;
  const count = debounce(async () => {
    try { const r = await api('broadcasts.count', { audience: a }); $('#audN').textContent = num(r.count); } catch (e) { $('#audN').textContent = '?'; }
  }, 250);
  function renderAud() {
    $('#audEd').innerHTML = `
      <div class="fld"><label class="lbl">Заявка с лендинга</label><div class="seg" id="aLead">${[['any', 'Все'], ['yes', 'Оставили заявку'], ['no', 'Без заявки']].map(([k, t]) => `<button data-v="${k}" class="${a.lead === k ? 'on' : ''}">${t}</button>`).join('')}</div></div>
      <div class="fld"><label class="lbl">Теги — клик: <span class="chip v">с тегом</span> · ещё клик: <span class="chip r">исключить</span> · ещё клик: сброс</label>
        <div class="tag-pick" id="aTags">${S.tags.length ? S.tags.map(t => `<button data-t="${esc(t.tag)}" class="${a.tags_any.includes(t.tag) ? 'on' : a.tags_none.includes(t.tag) ? 'no' : ''}">${esc(t.tag)} · ${t.cnt}</button>`).join('') : '<span style="color:var(--muted)">Тегов пока нет — они появятся из сценариев</span>'}</div>
        <div class="help">С несколькими отмеченными тегами получат те, у кого есть хотя бы один.</div></div>
      <div class="grid2"><div class="fld"><label class="lbl">Пришли в бот с</label><input class="in" type="date" id="aFrom" value="${a.joined_from || ''}"></div><div class="fld"><label class="lbl">по</label><input class="in" type="date" id="aTo" value="${a.joined_to || ''}"></div></div>
      <div class="aud-count"><b id="audN">…</b> человек получат рассылку <span style="color:var(--muted);font-weight:500">(без заблокировавших)</span></div>`;
    count();
  }
  renderAud();
  $('#audEd').addEventListener('click', e => {
    const l = e.target.closest('#aLead button');
    if (l) { a.lead = l.dataset.v; setDirty(true); renderAud(); return; }
    const t = e.target.closest('[data-t]');
    if (t) {
      const tag = t.dataset.t;
      if (a.tags_any.includes(tag)) { a.tags_any = a.tags_any.filter(x => x !== tag); a.tags_none.push(tag); }
      else if (a.tags_none.includes(tag)) a.tags_none = a.tags_none.filter(x => x !== tag);
      else a.tags_any.push(tag);
      setDirty(true); renderAud();
    }
  });
  $('#audEd').addEventListener('change', e => {
    if (e.target.id === 'aFrom') a.joined_from = e.target.value;
    if (e.target.id === 'aTo') a.joined_to = e.target.value;
    setDirty(true); count();
  });

  async function save(quiet) {
    const r = await api('broadcasts.save', { id: bc.id, title: bc.title, message: bc.message, audience: a });
    if (!bc.id) { bc.id = r.id; skipRoute = true; location.hash = '#broadcasts/' + r.id; lastHash = location.hash; }
    setDirty(false);
    if (!quiet) toast('Черновик сохранён');
  }
  $('#bSave').addEventListener('click', e => busy(e.currentTarget, () => save()).catch(fail));
  $('#bTest').addEventListener('click', e => busy(e.currentTarget, async () => { await api('broadcasts.test', { message: bc.message }); toast('Отправлено в ваш Telegram'); }).catch(fail));
  $('#bSend').addEventListener('click', async () => {
    if (!plain(bc.message.text).trim() && !(bc.message.media?.url)) return toast('Добавьте текст или медиа', true);
    const n = $('#audN').textContent;
    const now = new Date(Date.now() + 3600000);
    const local = new Date(now.getTime() + 5 * 3600000).toISOString().slice(0, 16);
    const res = await modal({
      title: 'Отправить рассылку?',
      body: `<p style="margin-bottom:14px">Получат: <b>${n}</b> человек.<br>Аудитория: ${esc(audText(a))}</p>
        <label class="lbl">Когда</label>
        <select class="in" name="when"><option value="now">Сейчас</option><option value="later">Запланировать</option></select>
        <div id="atWrap" hidden style="margin-top:10px"><label class="lbl">Дата и время (Ташкент)</label><input class="in" type="datetime-local" name="at" value="${local}"></div>`,
      ok: 'Отправить',
      onOpen: m => { const w = $('[name=when]', m); w.addEventListener('change', () => { $('#atWrap', m).hidden = w.value !== 'later'; }); },
    });
    if (!res) return;
    try {
      await save(true);
      let scheduled_at = null;
      if (res.when === 'later') {
        if (!res.at) return toast('Укажите дату и время', true);
        scheduled_at = new Date(res.at + ':00+05:00').toISOString();
        if (new Date(scheduled_at).getTime() < Date.now() + 60000) return toast('Время должно быть в будущем', true);
      }
      const r = await api('broadcasts.send', { id: bc.id, scheduled_at });
      toast(r.scheduled ? 'Рассылка запланирована' : `Рассылка запущена: ${num(r.total)} получателей`);
      route();
    } catch (err) { fail(err); }
  });
}

async function broadcastView(main, bc, errors) {
