    `${['sending'].includes(bc.status) ? `<button class="btn danger" id="cancel">${ic('x')} Остановить</button>` : ''}
     <button class="btn" id="copy">${ic('copy')} Копировать</button>
     ${['done', 'cancelled'].includes(bc.status) ? `<button class="btn danger" id="del">${ic('trash')}</button>` : ''}`) +
    `<div class="stats4">
      <div class="card kpi"><div class="k-l">Получателей</div><div class="k-v num">${num(bc.total)}</div></div>
      <div class="card kpi"><div class="k-l">Доставлено</div><div class="k-v num">${num(bc.sent)}</div><div class="k-s">${pct(bc.sent, bc.total)}</div></div>
      <div class="card kpi"><div class="k-l">Заблокировали бота</div><div class="k-v num">${num(bc.blocked)}</div></div>
      <div class="card kpi"><div class="k-l">Ошибки</div><div class="k-v num">${num(bc.failed)}</div></div>
    </div>
    ${bc.status === 'sending' ? `<div class="card" style="margin-bottom:16px"><div class="card-b"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Отправляется…</b><span class="num">${pct(done, bc.total)}</span></div><div class="prog" style="height:10px"><i style="width:${bc.total ? done / bc.total * 100 : 0}%"></i></div><div class="help">~20 сообщений в секунду (лимит Telegram). Страница обновляется сама.</div></div></div>` : ''}
    <div class="bc-layout"><div class="card"><div class="card-h"><h3>Детали</h3></div><div class="card-b"><dl class="kv">
      <dt>Создана</dt><dd>${fmtDate(bc.created_at)}</dd><dt>Старт</dt><dd>${fmtDate(bc.started_at)}</dd><dt>Завершена</dt><dd>${fmtDate(bc.finished_at)}</dd>
      ${bc.scheduled_at ? `<dt>Запланирована</dt><dd>${fmtDate(bc.scheduled_at)}</dd>` : ''}</dl>
      ${errors.length ? `<h4 style="margin:18px 0 8px">Ошибки</h4><table class="tbl"><tbody>${errors.map(x => `<tr><td style="font-size:12.5px">${esc(x.error)}</td><td class="r num">${x.n}</td></tr>`).join('')}</tbody></table>` : ''}
      </div></div>
      <div class="card"><div class="card-h"><h3>Сообщение</h3></div><div class="card-b">${tgPreview(bc.message)}</div></div></div>`;
  $('#cancel')?.addEventListener('click', async () => { if (await confirmBox('Остановить рассылку?', 'Оставшиеся сообщения не будут отправлены.', 'Остановить', true)) { await api('broadcasts.cancel', { id: bc.id }).catch(fail); route(); } });
  $('#copy').addEventListener('click', async () => { try { const r = await api('broadcasts.copy', { id: bc.id }); location.hash = '#broadcasts/' + r.id; } catch (e) { fail(e); } });
  $('#del')?.addEventListener('click', async () => { if (await confirmBox('Удалить рассылку?', 'Статистика тоже удалится.', 'Удалить', true)) { await api('broadcasts.delete', { id: bc.id }).catch(fail); location.hash = '#broadcasts'; } });
  if (bc.status === 'sending') { const t = setTimeout(route, 4000); pageCleanup.push(() => clearTimeout(t)); }
}

/* =====================================================================
   НАСТРОЙКИ
   ===================================================================== */
PAGES.settings = async main => {
  const [st, info] = await Promise.all([api('settings.get'), api('bot.info').catch(() => ({ connected: false }))]);
  S.settings = st;
  updateBotPill(st.bot_username);
  const notify = [...(st.notify_chats || [])];
  main.innerHTML = pageHead('Настройки') + `<div class="set-grid">
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="card"><div class="card-h"><h3>Telegram-бот</h3>${info.connected ? `<span class="chip g">● подключён</span>` : '<span class="chip r">не подключён</span>'}</div><div class="card-b">
      ${info.connected ? `<dl class="kv" style="margin-bottom:16px"><dt>Бот</dt><dd><a href="https://t.me/${esc(info.username)}" target="_blank"><b>@${esc(info.username)}</b></a> · ${esc(info.name || '')}</dd>
        <dt>Webhook</dt><dd>${info.webhook_ok ? '<span class="chip g">работает</span>' : '<span class="chip r">не настроен — переподключите</span>'}</dd>
        <dt>В очереди</dt><dd class="num">${info.pending}</dd>
        ${info.last_error ? `<dt>Последняя ошибка</dt><dd style="color:var(--bad)">${esc(info.last_error)} · ${fmtDate(new Date(info.last_error_date * 1000).toISOString())}</dd>` : ''}
        <dt>Ссылка с лендинга</dt><dd><code>t.me/${esc(info.username)}?start=l_…</code></dd>
        <dt>Ссылка с меткой</dt><dd><code>t.me/${esc(info.username)}?start=insta_bio</code><div class="help">Метку ловит сценарий с запуском «Ссылка с меткой»</div></dd></dl>` :
        `<ol class="steps-list">
          <li><span>Откройте <a href="https://t.me/BotFather" target="_blank">@BotFather</a> → <code>/newbot</code></span></li>
          <li><span>Имя бота: <code>Be Soft</code></span></li>
          <li><span>Username (латиница, на <code>bot</code>), например <code>besoft_uz_bot</code></span></li>
          <li><span>Скопируйте токен вида <code>123456:ABC…</code> и вставьте ниже</span></li></ol>`}
      <form id="botForm" class="row"><input class="in" name="token" type="password" placeholder="${info.connected ? 'Новый токен (для переподключения)' : 'Токен от @BotFather'}" autocomplete="off"><button class="btn primary" type="submit">${info.connected ? 'Переподключить' : 'Подключить'}</button></form>
      <div class="help">Токен хранится на сервере и в браузер больше не отдаётся. Webhook ставится автоматически.</div>
      ${info.connected ? `<button class="btn sm danger" id="botOff" style="margin-top:12px">Отключить бота</button>` : ''}
    </div></div>

    <div class="card"><div class="card-h"><h3>Уведомления менеджерам</h3></div><div class="card-b">
      <p class="help" style="margin:0 0 12px">Сюда бот присылает новые лиды, вопросы из сценариев и сообщения в боте. Чтобы добавить <b>группу</b> — добавьте бота в группу менеджеров, она появится в списке. Чтобы добавить <b>человека</b> — он должен нажать /start в боте.</p>
      <div class="recips" id="recips"></div>
      <div class="picker"><input class="in" id="recipQ" placeholder="+ Найти группу или подписчика (имя, @username)"><div class="picker-res" id="recipRes" hidden></div></div>
      <label class="row" style="gap:8px;margin-top:14px;font-weight:600"><span class="switch"><input type="checkbox" id="notifMsg" ${st.notify_messages ? 'checked' : ''}><span></span></span>Пересылать сообщения подписчиков (не ответы на вопросы сценария)</label>
    </div></div>

    <div class="card"><div class="card-h"><h3>Тестовый Telegram</h3></div><div class="card-b">
      <p class="help" style="margin:0 0 10px">Куда приходят кнопки «Тест» в сценариях и рассылках. Нажмите /start в боте, затем найдите себя.</p>
      <div id="testCur" style="margin-bottom:10px">${st.test_sub ? `<div class="recip"><span>${esc(st.test_sub.name)}</span><small>${st.test_sub.username ? '@' + esc(st.test_sub.username) : st.test_sub.chat_id}</small></div>` : '<span style="color:var(--muted)">не выбран</span>'}</div>
      <div class="picker"><input class="in" id="testQ" placeholder="Найти себя: имя или @username"><div class="picker-res" id="testRes" hidden></div></div>
    </div></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="card"><div class="card-h"><h3>amoCRM — отправка лидов</h3>${st.amo_token_set && st.amo_base_url ? '<span class="chip g">включено</span>' : '<span class="chip">выключено</span>'}</div><div class="card-b">
      <p class="help" style="margin:0 0 12px">Каждый лид с лендинга создаст сделку + контакт в amoCRM (с UTM-метками). Токен: amoCRM → Настройки → Интеграции → Создать интеграцию (внешняя) → «Долгосрочный токен».</p>
      <form id="amoForm">
        <div class="fld"><label class="lbl">Адрес аккаунта</label><input class="in" name="amo_base_url" value="${esc(st.amo_base_url)}" placeholder="https://besoft.amocrm.ru"></div>
        <div class="fld"><label class="lbl">Долгосрочный токен</label><input class="in" name="amo_token" type="password" autocomplete="off" placeholder="${st.amo_token_set ? '•••••• задан (оставьте пустым, чтобы не менять)' : 'eyJ0eXAiOiJKV1Qi…'}"></div>
        <div class="grid2"><div class="fld"><label class="lbl">Воронка</label><select class="in" name="amo_pipeline_id" id="amoPipe"><option value="${esc(st.amo_pipeline_id)}">${st.amo_pipeline_id ? 'ID ' + esc(st.amo_pipeline_id) : 'Основная (по умолчанию)'}</option></select></div>
        <div class="fld"><label class="lbl">Этап</label><select class="in" name="amo_status_id" id="amoStatus"><option value="${esc(st.amo_status_id)}">${st.amo_status_id ? 'ID ' + esc(st.amo_status_id) : 'Первый (по умолчанию)'}</option></select></div></div>
        <div class="fld"><label class="lbl">Доп. теги сделки</label><input class="in" name="amo_tags" value="${esc(st.amo_tags)}" placeholder="таргет, uz"></div>
        <div class="row"><button class="btn primary" type="submit">Сохранить</button><button class="btn" type="button" id="amoLoad">Загрузить воронки</button>${st.amo_token_set ? '<button class="btn danger" type="button" id="amoOff">Отключить</button>' : ''}</div>
      </form>
    </div></div>

    <div class="card"><div class="card-h"><h3>Webhook лидов (Make, Albato, Sheets…)</h3></div><div class="card-b">
      <form id="whForm" class="row"><input class="in" name="lead_webhook_url" value="${esc(st.lead_webhook_url)}" placeholder="https://hook.eu1.make.com/…"><button class="btn" type="submit">Сохранить</button></form>
      <div class="help">POST JSON: id, landing, name, phone, created_at, utm_*, fbclid, page_url</div>
    </div></div>

    <div class="card"><div class="card-h"><h3>Администраторы</h3></div><div class="card-b">
      <table class="tbl" style="margin-bottom:12px"><tbody>${st.admins.map(a => `<tr><td><b>${esc(a.name || a.login)}</b> <span style="color:var(--muted)">@${esc(a.login)}</span></td><td style="color:var(--muted);font-size:12px">${a.last_login_at ? 'вход ' + fmtDate(a.last_login_at) : 'не входил'}</td><td class="r">${a.id === st.me ? '<span class="chip v">вы</span>' : `<button class="btn ghost sm danger" data-rmadm="${a.id}">${ic('trash')}</button>`}</td></tr>`).join('')}</tbody></table>
      <div class="row"><button class="btn" id="addAdm">${ic('plus')} Добавить сотрудника</button><button class="btn" id="chPass">Сменить мой пароль</button></div>
    </div></div>
  </div></div>`;

  // бот
  $('#botForm').addEventListener('submit', e => {
    e.preventDefault();
    const token = e.target.token.value.trim(); if (!token) return toast('Вставьте токен', true);
    busy(e.submitter, async () => { try { const r = await api('bot.connect', { token }); toast(`Бот @${r.username} подключён`); route(); } catch (err) { fail(err); } });
  });
  $('#botOff')?.addEventListener('click', async () => { if (await confirmBox('Отключить бота?', 'Бот перестанет отвечать, лендинг не будет перекидывать в Telegram.', 'Отключить', true)) { await api('bot.disconnect').catch(fail); route(); } });

  // получатели уведомлений
  const renderRecips = () => {
    $('#recips').innerHTML = notify.length ? notify.map((c, i) => `<div class="recip"><span>${c.type === 'group' || c.type === 'supergroup' ? '👥' : '👤'} ${esc(c.title || c.id)}</span><small>${c.id}</small><button class="btn ghost sm danger" data-rmr="${i}">${ic('x')}</button></div>`).join('') : '<span style="color:var(--muted)">Никто не получает уведомления</span>';
  };
  renderRecips();
  const saveNotify = async () => { try { await api('settings.save', { notify_chats: notify }); toast('Сохранено'); } catch (e) { fail(e); } };
  $('#recips').addEventListener('click', e => { const b = e.target.closest('[data-rmr]'); if (b) { notify.splice(+b.dataset.rmr, 1); renderRecips(); saveNotify(); } });
  function picker(inputSel, resSel, includeGroups, onPick) {
    const inp = $(inputSel), res = $(resSel);
    const search = debounce(async () => {
      const q = inp.value.trim();
      const groups = includeGroups ? (st.groups || []).filter(g => !q || String(g.title).toLowerCase().includes(q.toLowerCase())) : [];
      let subs = [];
      if (q.length >= 2) subs = (await api('subs.list', { q, status: 'active', limit: 8 }).catch(() => ({ items: [] }))).items;
      const items = [...groups.map(g => ({ id: g.id, title: g.title, type: g.type, label: '👥 ' + g.title })), ...subs.map(s => ({ id: s.chat_id, title: subName(s), type: 'private', label: `👤 ${subName(s)} ${s.username ? '@' + s.username : ''}` }))];
      res.hidden = !items.length && !q;
      res.innerHTML = items.length ? items.map((it, i) => `<button type="button" data-i="${i}">${esc(it.label)}</button>`).join('') : `<div class="help" style="padding:10px 12px">Не найдено. ${includeGroups ? 'Добавьте бота в группу или попросите человека нажать /start.' : 'Нажмите /start в боте.'}</div>`;
      res.onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; onPick(items[+b.dataset.i]); res.hidden = true; inp.value = ''; };
    }, 250);
    inp.addEventListener('input', search);
    inp.addEventListener('focus', search);
    const off = e => { if (!e.target.closest('.picker')) res.hidden = true; };
    document.addEventListener('click', off);
    pageCleanup.push(() => document.removeEventListener('click', off));
  }
  picker('#recipQ', '#recipRes', true, it => { if (!notify.some(c => c.id === it.id)) { notify.push({ id: it.id, title: it.title, type: it.type }); renderRecips(); saveNotify(); } });
  picker('#testQ', '#testRes', false, async it => {
    try { await api('settings.save', { test_chat_id: it.id }); $('#testCur').innerHTML = `<div class="recip"><span>${esc(it.title)}</span><small>${it.id}</small></div>`; toast('Тестовый Telegram выбран'); } catch (e) { fail(e); }
  });
  $('#notifMsg').addEventListener('change', e => api('settings.save', { notify_messages: e.target.checked }).then(() => toast('Сохранено')).catch(fail));

  // amoCRM
  $('#amoForm').addEventListener('submit', e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target));
    if (f.amo_base_url && !/^https:\/\/[a-z0-9-]+\.(amocrm\.(ru|com)|kommo\.com)\/?$/i.test(f.amo_base_url.trim())) return toast('Адрес вида https://ваш-аккаунт.amocrm.ru', true);
    if (!f.amo_token) delete f.amo_token;
    busy(e.submitter, async () => { try { await api('settings.save', f); toast('amoCRM сохранён'); route(); } catch (err) { fail(err); } });
  });
  $('#amoOff')?.addEventListener('click', async () => { await api('settings.save', { amo_token: null }).catch(fail); toast('amoCRM отключён'); route(); });
  $('#amoLoad').addEventListener('click', e => busy(e.currentTarget, async () => {
    try {
      const { items } = await api('amo.pipelines');
      const pSel = $('#amoPipe'), sSel = $('#amoStatus');
      pSel.innerHTML = '<option value="">Основная (по умолчанию)</option>' + items.map(p => `<option value="${p.id}" ${String(p.id) === String(st.amo_pipeline_id) ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
      const fillSt = () => { const p = items.find(x => String(x.id) === pSel.value); sSel.innerHTML = '<option value="">Первый (по умолчанию)</option>' + (p?.statuses || []).map(s => `<option value="${s.id}" ${String(s.id) === String(st.amo_status_id) ? 'selected' : ''}>${esc(s.name)}</option>`).join(''); };
      pSel.onchange = fillSt; fillSt();
      toast('Воронки загружены — выберите и сохраните');
    } catch (err) { fail(err); }
  }));
  $('#whForm').addEventListener('submit', e => { e.preventDefault(); const v = e.target.lead_webhook_url.value.trim(); if (v && !/^https:\/\//.test(v)) return toast('Нужен https://', true); api('settings.save', { lead_webhook_url: v }).then(() => toast('Сохранено')).catch(fail); });

  // админы
  $('#addAdm').addEventListener('click', async () => {
    const r = await modal({ title: 'Новый сотрудник', ok: 'Добавить', body: `<div class="fld"><label class="lbl">Имя</label><input class="in" name="name" placeholder="Иззат"></div><div class="fld"><label class="lbl">Логин (латиница)</label><input class="in" name="login" placeholder="izzat"></div><div class="fld"><label class="lbl">Пароль (от 8 символов)</label><input class="in" name="password" type="text" autocomplete="off"></div><div class="help">Передайте логин и пароль сотруднику лично. Он сможет сменить пароль в Настройках.</div>` });
    if (!r) return;
    try { await api('admins.add', r); toast('Сотрудник добавлен'); route(); } catch (e) { fail(e); }
  });
  $('#chPass').addEventListener('click', async () => {
    const r = await modal({ title: 'Сменить пароль', ok: 'Сменить', body: `<div class="fld"><label class="lbl">Новый пароль (от 8 символов)</label><input class="in" name="password" type="password" autocomplete="new-password"></div>` });
    if (!r) return;
    try { await api('admins.password', r); toast('Пароль изменён, другие сессии завершены'); } catch (e) { fail(e); }
  });
  main.addEventListener('click', async e => {
    const b = e.target.closest('[data-rmadm]'); if (!b) return;
    if (!(await confirmBox('Удалить сотрудника?', 'Он больше не сможет войти.', 'Удалить', true))) return;
    try { await api('admins.remove', { id: +b.dataset.rmadm }); route(); } catch (err) { fail(err); }
  });
};

boot();
</script>
